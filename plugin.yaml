name: bot-to-bot
version: 1.0.0
description: >-
  Bot-to-Bot (B2B): message any bot on this install from ANY session — regular
  Sessions mode included — without creating new sessions. Fire-and-forget by
  default (the reply returns later as a completion notification, like Bot
  Mode's message_agent); mode='wait' blocks for the reply on cron/one-shot
  surfaces. Each message lands in the target's canonical Bot Chat, reusing the
  same delivery plane Bot Mode uses. Tools: b2b_call (message a bot, get reply),
  b2b_list (list reachable bots), b2b_send (send AS a bot to a channel).
author: Andrew Supit
provides_tools:
  - b2b_call
  - b2b_list
  - b2b_send
